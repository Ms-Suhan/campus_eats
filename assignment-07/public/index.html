<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusEats Orders (GraphQL)</title>
  <style>
    :root { --accent: #d9480f; --bg: #fff8f3; --ink: #2b2118; --line: #f0d9c8; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); margin: 0; padding: 24px 16px; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { margin: 0 0 4px; color: var(--accent); }
    p.sub { margin: 0 0 20px; color: #7a6555; }
    section { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
    h2 { margin: 0 0 12px; font-size: 1.05rem; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
    th { color: #7a6555; font-weight: 600; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    label { display: flex; flex-direction: column; font-size: .85rem; gap: 4px; }
    input { padding: 8px; border: 1px solid var(--line); border-radius: 6px; font-size: .95rem; }
    button { grid-column: 1 / -1; padding: 10px; background: var(--accent); color: #fff; border: 0; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    #msg { margin-top: 10px; font-size: .9rem; min-height: 1.2em; }
    .err { color: #c92a2a; }
    .ok { color: #2b8a3e; }
  </style>
</head>
<body>
<main>
  <h1>CampusEats Orders</h1>
  <p class="sub">Read and written through one GraphQL endpoint.</p>

  <section>
    <h2>All orders</h2>
    <table>
      <thead>
        <tr><th>ID</th><th>Customer</th><th>Item</th><th>Qty</th><th>Total (₹)</th><th>Status</th><th>Note</th></tr>
      </thead>
      <tbody id="rows"><tr><td colspan="7">Loading…</td></tr></tbody>
    </table>
  </section>

  <section>
    <h2>Add an order</h2>
    <form id="addForm">
      <label>Customer name <input name="customerName" required value="Kabir Joshi"></label>
      <label>Item <input name="item" required value="Samosa"></label>
      <label>Quantity <input name="quantity" type="number" min="1" value="2"></label>
      <label>Total (₹) <input name="total" type="number" step="0.01" min="0" required value="40"></label>
      <label>Note (optional) <input name="note" placeholder="e.g. less oil"></label>
      <button type="submit">Add order (mutation)</button>
    </form>
    <div id="msg"></div>
  </section>
</main>

<script>
  const ENDPOINT = '/graphql';

  async function gql(query, variables) {
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, variables }),
    });
    const json = await res.json();
    if (json.errors) throw new Error(json.errors[0].message);
    return json.data;
  }

  const LIST_QUERY = `query { orders { id customerName item quantity total status note } }`;

  const ADD_MUTATION = `
    mutation ($input: AddOrderInput!) {
      addOrder(input: $input) { id customerName item total }
    }`;

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function loadOrders() {
    const { orders } = await gql(LIST_QUERY);
    document.getElementById('rows').innerHTML = orders.map(o => `
      <tr>
        <td>${esc(o.id)}</td><td>${esc(o.customerName)}</td><td>${esc(o.item)}</td>
        <td>${esc(o.quantity)}</td><td>${Number(o.total).toFixed(2)}</td>
        <td>${esc(o.status)}</td><td>${esc(o.note) || '—'}</td>
      </tr>`).join('');
  }

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const msg = document.getElementById('msg');
    const input = {
      customerName: f.get('customerName'),
      item: f.get('item'),
      quantity: parseInt(f.get('quantity'), 10) || 1,
      total: parseFloat(f.get('total')),
    };
    const note = f.get('note').trim();
    if (note) input.note = note; // note is optional, so only send it when filled
    try {
      const { addOrder } = await gql(ADD_MUTATION, { input });
      msg.className = 'ok';
      msg.textContent = `Added order #${addOrder.id}: ${addOrder.item} for ${addOrder.customerName}`;
      await loadOrders();
    } catch (err) {
      msg.className = 'err';
      msg.textContent = err.message;
    }
  });

  loadOrders().catch(err => {
    document.getElementById('rows').innerHTML = `<tr><td colspan="7" class="err">${esc(err.message)}</td></tr>`;
  });
</script>
</body>
</html>
